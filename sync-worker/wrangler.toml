name = "lector"
main = "src/index.js"
compatibility_date = "2026-03-11"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
APP_HOST = "lector.sarthakjariwala.com"
DESKTOP_SYNC_HOST = "sync.lector.sarthakjariwala.com"
APP_ORIGIN = "https://lector.sarthakjariwala.com"

[[routes]]
pattern = "lector.sarthakjariwala.com"
custom_domain = true

[[routes]]
pattern = "sync.lector.sarthakjariwala.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "lector-sync"
database_id = "d5039a0e-ad88-4bcc-b3bc-29d207d3ab37"
